<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" fill="none">
  <defs>
    <style>
      text { font-family: "Ubuntu Sans", "Segoe UI", Arial, sans-serif; fill: #26313F; }
      .title { font-size: 31px; font-weight: 600; letter-spacing: -0.5px; }
      .subtitle { font-size: 16px; fill: #667386; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; fill: #687588; }
      .module-title { font-size: 18px; font-weight: 600; }
      .body { font-size: 14px; fill: #536174; }
      .small { font-size: 12px; fill: #6C7889; }
      .artifact { font-size: 13px; font-weight: 600; }
      .actor { font-size: 16px; font-weight: 600; }
      .lane { fill: #F7F9FC; stroke: #DCE2EA; stroke-width: 1.2; }
      .module { fill: #FFFFFF; stroke: #C9D2DE; stroke-width: 1.3; }
      .module-accent { fill: #FFFFFF; stroke: #607FAE; stroke-width: 1.7; }
      .artifact-box { fill: #EEF3FA; stroke: #AFC0D8; stroke-width: 1.1; }
      .foundation { fill: #F4F6F9; stroke: #CBD4E0; stroke-width: 1.1; }
      .flow { stroke: #506176; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .assist { stroke: #9B6FB0; stroke-width: 1.7; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow-purple); }
      .oversight { stroke: #C95C60; stroke-width: 1.7; stroke-dasharray: 3 5; fill: none; marker-end: url(#arrow-red); }
      .soft-line { stroke: #B3BECC; stroke-width: 1.2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#506176"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#9B6FB0"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#C95C60"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#26313F" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="1800" height="1040" fill="#FFFFFF"/>
  <text x="72" y="62" class="title">OralEval: evidence-grounded adaptive oral assessment</text>
  <text x="72" y="90" class="subtitle">Role-aware course authoring, multimodal evidence modelling, criterion-level evaluation, and accountable human oversight</text>

  <!-- Role layer -->
  <text x="72" y="140" class="section">HUMAN ROLES &amp; GOVERNANCE</text>
  <rect x="72" y="158" width="1656" height="120" rx="12" class="lane"/>

  <rect x="98" y="181" width="190" height="74" rx="10" fill="#EAF2FB" stroke="#AFC5DF"/>
  <circle cx="132" cy="210" r="14" fill="#607FAE"/>
  <path d="M111 244c3-14 12-21 21-21s18 7 21 21" fill="#607FAE"/>
  <text x="164" y="207" class="actor">Professor</text>
  <text x="164" y="229" class="small">author · approve · moderate</text>

  <rect x="1512" y="181" width="190" height="74" rx="10" fill="#ECF6F0" stroke="#ACD1BB"/>
  <circle cx="1546" cy="210" r="14" fill="#4E8A68"/>
  <path d="M1525 244c3-14 12-21 21-21s18 7 21 21" fill="#4E8A68"/>
  <text x="1578" y="207" class="actor">Student</text>
  <text x="1578" y="229" class="small">submit · defend · reflect</text>

  <rect x="348" y="180" width="300" height="76" rx="10" class="module"/>
  <text x="370" y="207" class="module-title">Course membership</text>
  <text x="370" y="231" class="body">Roster · enrolment · role-based access</text>

  <rect x="724" y="180" width="352" height="76" rx="10" class="module"/>
  <text x="746" y="207" class="module-title">Human decision points</text>
  <text x="746" y="231" class="body">Rubric approval · report moderation · override</text>

  <rect x="1152" y="180" width="292" height="76" rx="10" class="module"/>
  <text x="1174" y="207" class="module-title">Role-specific dashboards</text>
  <text x="1174" y="231" class="body">Student feedback · professor analytics</text>


  <!-- Authoring plane -->
  <text x="72" y="322" class="section">A. INSTRUCTION &amp; ASSESSMENT AUTHORING</text>
  <rect x="72" y="340" width="1656" height="205" rx="14" class="lane"/>

  <rect x="106" y="372" width="310" height="140" rx="11" class="module-accent" filter="url(#shadow)"/>
  <rect x="106" y="372" width="7" height="140" rx="3.5" fill="#607FAE"/>
  <text x="136" y="405" class="module-title">Course workspace</text>
  <text x="136" y="433" class="body">Course type</text>
  <text x="237" y="433" class="small">seminar · coursework · thesis · programming</text>
  <text x="136" y="460" class="body">Teaching context</text>
  <text x="250" y="460" class="small">materials · examples · code templates</text>
  <text x="136" y="487" class="body">Participation</text>
  <text x="229" y="487" class="small">roster · enrolment policy</text>

  <rect x="510" y="372" width="380" height="140" rx="11" class="module-accent" filter="url(#shadow)"/>
  <rect x="510" y="372" width="7" height="140" rx="3.5" fill="#607FAE"/>
  <text x="540" y="405" class="module-title">Assessment authoring</text>
  <text x="540" y="433" class="body">Task &amp; accepted modalities</text>
  <text x="540" y="460" class="body">Evaluation criteria &amp; weights</text>
  <text x="540" y="487" class="body">Oral-exam policy · deadline · resources</text>

  <rect x="988" y="372" width="310" height="140" rx="11" fill="#FAF7FC" stroke="#C9AED5" stroke-width="1.3"/>
  <text x="1018" y="405" class="module-title">AI authoring assistant</text>
  <text x="1018" y="435" class="body">Analyse teaching materials</text>
  <text x="1018" y="461" class="body">Propose criteria and weights</text>
  <text x="1018" y="487" class="small">Suggestions require professor approval</text>

  <rect x="1390" y="382" width="285" height="120" rx="10" class="artifact-box"/>
  <text x="1416" y="413" class="artifact">ASSESSMENT CONTRACT</text>
  <line x1="1416" y1="424" x2="1648" y2="424" class="soft-line"/>
  <text x="1416" y="451" class="body">task · modalities · rubric</text>
  <text x="1416" y="477" class="body">weights · policy · version</text>

  <path d="M416 442H510" class="flow"/>
  <path d="M890 407V354H1532V382" class="flow"/>
  <path d="M988 442H912" class="assist"/>
  <text x="920" y="426" class="small">suggest</text>

  <!-- Execution plane -->
  <text x="72" y="590" class="section">B. ASSESSMENT EXECUTION &amp; EVIDENCE PIPELINE</text>
  <rect x="72" y="608" width="1656" height="260" rx="14" class="lane"/>

  <rect x="106" y="645" width="235" height="176" rx="11" class="module" filter="url(#shadow)"/>
  <text x="132" y="680" class="module-title">Submission gateway</text>
  <text x="132" y="711" class="body">Enrolment check</text>
  <text x="132" y="738" class="body">Modality validation</text>
  <text x="132" y="765" class="body">document · slides</text>
  <text x="132" y="792" class="body">code · figures · data</text>

  <rect x="397" y="645" width="275" height="176" rx="11" class="module" filter="url(#shadow)"/>
  <text x="423" y="680" class="module-title">Evidence construction</text>
  <text x="423" y="711" class="body">Parse &amp; normalize</text>
  <text x="423" y="738" class="body">Extract claims and decisions</text>
  <text x="423" y="765" class="body">Link evidence to source spans</text>
  <text x="423" y="792" class="body">Preserve modality provenance</text>

  <rect x="730" y="665" width="205" height="136" rx="10" class="artifact-box"/>
  <text x="753" y="699" class="artifact">EVIDENCE MODEL</text>
  <line x1="753" y1="710" x2="912" y2="710" class="soft-line"/>
  <text x="753" y="738" class="body">claims · methods</text>
  <text x="753" y="764" class="body">results · weaknesses</text>

  <rect x="993" y="645" width="285" height="176" rx="11" class="module-accent" filter="url(#shadow)"/>
  <text x="1019" y="680" class="module-title">Adaptive examination</text>
  <text x="1019" y="711" class="body">Question policy &amp; planner</text>
  <text x="1019" y="738" class="body">Student answer (text / voice)</text>
  <text x="1019" y="765" class="body">Evidence-linked follow-up</text>
  <text x="1019" y="792" class="small">Produces a complete exam trace</text>

  <rect x="1336" y="645" width="340" height="176" rx="11" class="module-accent" filter="url(#shadow)"/>
  <text x="1362" y="680" class="module-title">Criterion-level evaluation</text>
  <text x="1362" y="711" class="body">Score each response against rubric</text>
  <text x="1362" y="738" class="body">Check evidence alignment &amp; reasoning</text>
  <text x="1362" y="765" class="body">Calibrate confidence and aggregate weights</text>
  <text x="1362" y="792" class="small">Professor moderation before release</text>

  <path d="M341 733H397" class="flow"/>
  <path d="M672 733H730" class="flow"/>
  <path d="M935 733H993" class="flow"/>
  <path d="M1278 733H1336" class="flow"/>
  <path d="M1532 502V592H1135V645" class="flow"/>
  <text x="1310" y="580" class="small">assessment contract</text>
  <path d="M1532 502V566H1515V645" class="flow"/>
  <text x="1264" y="558" class="small">criteria &amp; weights</text>

  <!-- Outcome arrows -->
  <path d="M1676 770H1710V255" class="flow"/>
  <text x="1724" y="520" transform="rotate(-90 1724 520)" class="small">feedback &amp; results</text>

  <!-- Platform plane -->
  <text x="72" y="914" class="section">C. TRUSTED PLATFORM SERVICES</text>
  <rect x="72" y="930" width="1656" height="82" rx="12" class="foundation"/>

  <text x="104" y="963" class="artifact">Identity &amp; access</text>
  <text x="104" y="987" class="small">RBAC · enrolment · consent</text>
  <line x1="365" y1="949" x2="365" y2="993" class="soft-line"/>

  <text x="400" y="963" class="artifact">Data &amp; provenance</text>
  <text x="400" y="987" class="small">course store · artifacts · exam trace · audit</text>
  <line x1="735" y1="949" x2="735" y2="993" class="soft-line"/>

  <text x="770" y="963" class="artifact">Model services</text>
  <text x="770" y="987" class="small">document models · LLM gateway · code sandbox</text>
  <line x1="1110" y1="949" x2="1110" y2="993" class="soft-line"/>

  <text x="1145" y="963" class="artifact">Safety &amp; privacy</text>
  <text x="1145" y="987" class="small">PII controls · encryption · retention policy</text>
  <line x1="1455" y1="949" x2="1455" y2="993" class="soft-line"/>

  <text x="1490" y="963" class="artifact">Quality assurance</text>
  <text x="1490" y="987" class="small">monitoring · bias · calibration</text>

  <!-- Legend -->
  <path d="M1170 76H1220" class="flow"/>
  <text x="1230" y="81" class="small">data / control flow</text>
  <path d="M1385 76H1435" class="assist"/>
  <text x="1445" y="81" class="small">AI assistance</text>
  <path d="M1570 76H1620" class="oversight"/>
  <text x="1630" y="81" class="small">human oversight</text>
</svg>
