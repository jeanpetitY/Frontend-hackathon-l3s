<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1100" viewBox="0 0 1900 1100" fill="none">
  <defs>
    <style>
      text { font-family: "Ubuntu Sans", Ubuntu, "Segoe UI", Arial, sans-serif; fill: #2F3440; }
      .figure-title { font-size: 32px; font-weight: 600; letter-spacing: -0.6px; }
      .figure-subtitle { font-size: 15px; font-weight: 400; fill: #667080; }
      .section-label { font-size: 12px; font-weight: 600; letter-spacing: 1.7px; fill: #687181; }
      .module-title { font-size: 18px; font-weight: 600; }
      .body { font-size: 14px; font-weight: 400; fill: #505A69; }
      .note { font-size: 12px; font-weight: 400; fill: #707988; }
      .artifact-title { font-size: 12px; font-weight: 600; letter-spacing: .7px; }
      .role { font-size: 13px; font-weight: 600; letter-spacing: .5px; fill: #FFFFFF; }
      .role-note { font-size: 14px; font-weight: 400; fill: #FFFFFF; fill-opacity: .72; }
      .lane { fill: #F7F8FA; stroke: #D6DBE3; stroke-width: 1.2; }
      .module { fill: #FFFFFF; stroke: #C8CFD9; stroke-width: 1.2; }
      .module-primary { fill: #FFFFFF; stroke: #5F6678; stroke-width: 1.8; }
      .module-agent { fill: #FFF8F8; stroke: #EF5B60; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .artifact { fill: #F0F2F6; stroke: #AEB7C5; stroke-width: 1.1; }
      .foundation { fill: #E9ECF1; stroke: #C5CCD6; stroke-width: 1.1; }
      .flow { fill: none; stroke: #5F6678; stroke-width: 1.8; marker-end: url(#arrow); }
      .agent-flow { fill: none; stroke: #EF5B60; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow-coral); }
      .policy-flow { fill: none; stroke: #8A93A2; stroke-width: 1.4; stroke-dasharray: 3 4; marker-end: url(#arrow-muted); }
      .divider { stroke: #D2D7DF; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#5F6678"/></marker>
    <marker id="arrow-coral" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#EF5B60"/></marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#8A93A2"/></marker>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2F3440" flood-opacity=".07"/></filter>
  </defs>

  <rect width="1900" height="1100" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="70" y="58" class="figure-title">OralEval for programming courses</text>
  <text x="70" y="86" class="figure-subtitle">Evidence-grounded adaptive oral assessment over code, execution traces, teaching context, and professor-defined criteria</text>

  <line x1="1322" y1="57" x2="1372" y2="57" class="flow"/>
  <text x="1382" y="62" class="note">verified data / control</text>
  <line x1="1542" y1="57" x2="1592" y2="57" class="agent-flow"/>
  <text x="1602" y="62" class="note">AI-assisted operation</text>
  <line x1="1322" y1="82" x2="1372" y2="82" class="policy-flow"/>
  <text x="1382" y="87" class="note">policy constraint</text>

  <!-- Actors -->
  <rect x="70" y="120" width="1760" height="88" rx="10" fill="#5F6678"/>
  <rect x="94" y="142" width="190" height="44" rx="6" fill="#FFFFFF" fill-opacity=".10" stroke="#FFFFFF" stroke-opacity=".22"/>
  <circle cx="119" cy="164" r="8" fill="#FFFFFF"/>
  <text x="139" y="169" class="role" fill="#FFFFFF">PROFESSOR</text>
  <text x="310" y="169" class="role-note">defines the task, executable oracle, rubric, and release decision</text>

  <rect x="773" y="142" width="180" height="44" rx="6" fill="#EF5B60"/>
  <circle cx="798" cy="164" r="8" fill="#FFFFFF"/>
  <text x="818" y="169" class="role" fill="#FFFFFF">AI SERVICES</text>
  <text x="979" y="169" class="role-note">assist analysis, questioning, dialogue, and evaluation</text>

  <rect x="1573" y="142" width="230" height="44" rx="6" fill="#FFFFFF" fill-opacity=".10" stroke="#FFFFFF" stroke-opacity=".22"/>
  <circle cx="1598" cy="164" r="8" fill="#FFFFFF"/>
  <text x="1618" y="169" class="role" fill="#FFFFFF">STUDENT</text>
  <text x="1714" y="169" class="role-note">submits · defends</text>

  <!-- Design-time lane -->
  <text x="70" y="252" class="section-label">A. ASSESSMENT DESIGN — PROFESSOR-CONTROLLED</text>
  <rect x="70" y="270" width="1760" height="240" rx="12" class="lane"/>

  <rect x="100" y="302" width="420" height="174" rx="10" class="module-primary" filter="url(#soft-shadow)"/>
  <rect x="100" y="302" width="7" height="174" rx="3.5" fill="#5F6678"/>
  <text x="132" y="337" class="module-title">Professor-defined context</text>
  <text x="132" y="368" class="body">Assignment specification &amp; learning objectives</text>
  <text x="132" y="395" class="body">Teaching materials &amp; assignment history</text>
  <text x="132" y="422" class="body">Reference solution · tests · expected behaviour</text>
  <text x="132" y="449" class="body">Evaluation criteria · weights · allowed resources</text>

  <rect x="596" y="316" width="308" height="146" rx="10" class="module-agent"/>
  <text x="626" y="350" class="module-title">Authoring assistant</text>
  <text x="626" y="380" class="body">Classify task and evidence needs</text>
  <text x="626" y="407" class="body">Suggest criterion coverage</text>
  <text x="626" y="434" class="note">Suggestions never bypass professor approval</text>

  <rect x="1000" y="302" width="425" height="174" rx="10" class="artifact" filter="url(#soft-shadow)"/>
  <text x="1032" y="335" class="artifact-title">PROGRAMMING ASSESSMENT CONTRACT</text>
  <line x1="1032" y1="348" x2="1393" y2="348" class="divider"/>
  <text x="1032" y="377" class="body">Task model</text>
  <text x="1155" y="377" class="note">implementation · debugging · review · algorithms</text>
  <text x="1032" y="404" class="body">Execution policy</text>
  <text x="1155" y="404" class="note">language · dependencies · limits · tests</text>
  <text x="1032" y="431" class="body">Assessment policy</text>
  <text x="1155" y="431" class="note">criteria · weights · question intents · version</text>
  <text x="1032" y="458" class="body">Executable oracle</text>
  <text x="1155" y="458" class="note">reference behaviour · tests · tolerances</text>

  <rect x="1517" y="328" width="262" height="122" rx="10" class="module"/>
  <text x="1545" y="363" class="module-title">Release gate</text>
  <text x="1545" y="393" class="body">Professor review &amp; approval</text>
  <text x="1545" y="420" class="body">Enrolled students only</text>

  <path d="M520 389H596" class="agent-flow"/>
  <path d="M520 350V288H1212V302" class="flow"/>
  <path d="M904 389H1000" class="agent-flow"/>
  <path d="M1425 389H1517" class="flow"/>
  <text x="1449" y="376" class="note">approve</text>

  <!-- Runtime lane -->
  <text x="70" y="558" class="section-label">B. RUN-TIME ASSESSMENT — EVIDENCE BEFORE SCORE</text>
  <rect x="70" y="576" width="1760" height="338" rx="12" class="lane"/>

  <rect x="96" y="620" width="225" height="242" rx="10" class="module" filter="url(#soft-shadow)"/>
  <text x="122" y="655" class="module-title">Student submission</text>
  <text x="122" y="687" class="body">Source code</text>
  <text x="122" y="714" class="body">Written explanation</text>
  <text x="122" y="741" class="body">Tests / output / figures</text>
  <line x1="122" y1="760" x2="295" y2="760" class="divider"/>
  <text x="122" y="787" class="note">Identity and enrolment check</text>
  <text x="122" y="812" class="note">Accepted-format validation</text>
  <text x="122" y="837" class="note">Immutable submission version</text>

  <rect x="370" y="620" width="284" height="242" rx="10" class="module-agent" filter="url(#soft-shadow)"/>
  <text x="398" y="655" class="module-title">Program analysis service</text>
  <text x="398" y="687" class="body">Static structure &amp; code entities</text>
  <text x="398" y="714" class="body">Sandboxed build and execution</text>
  <text x="398" y="741" class="body">Public / hidden test outcomes</text>
  <text x="398" y="768" class="body">Runtime traces and failure states</text>
  <text x="398" y="795" class="body">Relevant teaching references</text>
  <text x="398" y="834" class="note">No direct score is assigned at this stage</text>

  <rect x="704" y="638" width="250" height="206" rx="10" class="artifact"/>
  <text x="730" y="671" class="artifact-title">PROGRAM EVIDENCE GRAPH</text>
  <line x1="730" y1="684" x2="928" y2="684" class="divider"/>
  <text x="730" y="713" class="body">requirements ↔ code entities</text>
  <text x="730" y="740" class="body">tests ↔ execution traces</text>
  <text x="730" y="767" class="body">claims ↔ source spans</text>
  <text x="730" y="794" class="body">observed ↔ expected behaviour</text>
  <text x="730" y="821" class="note">Every edge retains provenance</text>

  <rect x="1004" y="620" width="330" height="242" rx="10" class="module-agent" filter="url(#soft-shadow)"/>
  <text x="1032" y="655" class="module-title">Adaptive oral examination</text>
  <rect x="1032" y="679" width="274" height="39" rx="5" fill="#FFFFFF" stroke="#D3D8E0"/>
  <text x="1048" y="704" class="body">1  Select criterion + evidence gap</text>
  <rect x="1032" y="727" width="274" height="39" rx="5" fill="#FFFFFF" stroke="#D3D8E0"/>
  <text x="1048" y="752" class="body">2  Ask evidence-linked question</text>
  <rect x="1032" y="775" width="274" height="39" rx="5" fill="#FFFFFF" stroke="#D3D8E0"/>
  <text x="1048" y="800" class="body">3  Update state; follow up if needed</text>
  <text x="1032" y="840" class="note">Student answers by text or voice</text>

  <rect x="1370" y="620" width="260" height="242" rx="10" class="module-agent" filter="url(#soft-shadow)"/>
  <text x="1398" y="655" class="module-title">Criterion evaluator</text>
  <text x="1398" y="687" class="body">Correctness &amp; understanding</text>
  <text x="1398" y="714" class="body">Justification &amp; debugging</text>
  <text x="1398" y="741" class="body">Code–evidence alignment</text>
  <text x="1398" y="768" class="body">Score · rationale · confidence</text>
  <line x1="1398" y1="787" x2="1602" y2="787" class="divider"/>
  <text x="1398" y="814" class="note">Weighted criterion aggregation</text>
  <text x="1398" y="839" class="note">Uncertainty triggers review</text>

  <rect x="1670" y="638" width="134" height="206" rx="10" class="artifact"/>
  <text x="1688" y="672" class="artifact-title">ROLE REPORTS</text>
  <line x1="1688" y1="684" x2="1786" y2="684" class="divider"/>
  <text x="1688" y="714" class="note">criterion scores</text>
  <text x="1688" y="743" class="note">student feedback</text>
  <text x="1688" y="772" class="note">cited evidence</text>
  <text x="1688" y="801" class="note">professor review</text>
  <text x="1688" y="830" class="note">final score</text>

  <path d="M321 741H370" class="flow"/>
  <path d="M654 741H704" class="flow"/>
  <path d="M954 741H1004" class="flow"/>
  <path d="M1334 741H1370" class="flow"/>
  <path d="M1630 741H1670" class="flow"/>

  <!-- Contract policy bus -->
  <path d="M1212 476V548H512V620" class="policy-flow"/>
  <path d="M1212 548H1169V620" class="policy-flow"/>
  <path d="M1212 548H1500V620" class="policy-flow"/>
  <text x="708" y="539" class="note">assessment contract constrains analysis, questioning, and evaluation</text>

  <!-- Examination trace annotation -->
  <rect x="1118" y="875" width="444" height="26" rx="13" fill="#FFF0F0" stroke="#F2AFB2"/>
  <text x="1142" y="893" class="note" fill="#A9474B">EXAM TRACE · question · criterion · evidence refs · answer · follow-up · model version</text>
  <path d="M1169 862V875" class="agent-flow"/>
  <path d="M1500 875V862" class="agent-flow"/>

  <!-- Platform foundation -->
  <text x="70" y="958" class="section-label">C. TRUST, REPRODUCIBILITY &amp; OPERATIONS</text>
  <rect x="70" y="976" width="1760" height="88" rx="10" class="foundation"/>

  <text x="104" y="1009" class="artifact-title">IDENTITY &amp; ACCESS</text>
  <text x="104" y="1037" class="note">RBAC · enrolment · consent</text>
  <line x1="366" y1="994" x2="366" y2="1048" class="divider"/>

  <text x="402" y="1009" class="artifact-title">SECURE CODE RUNTIME</text>
  <text x="402" y="1037" class="note">isolation · quotas · deterministic tests</text>
  <line x1="720" y1="994" x2="720" y2="1048" class="divider"/>

  <text x="756" y="1009" class="artifact-title">DATA &amp; PROVENANCE</text>
  <text x="756" y="1037" class="note">versioned artifacts · evidence · traces · audit</text>
  <line x1="1090" y1="994" x2="1090" y2="1048" class="divider"/>

  <text x="1126" y="1009" class="artifact-title">MODEL GATEWAY</text>
  <text x="1126" y="1037" class="note">prompt registry · model versions · redaction</text>
  <line x1="1426" y1="994" x2="1426" y2="1048" class="divider"/>

  <text x="1462" y="1009" class="artifact-title">RELIABILITY</text>
  <text x="1462" y="1037" class="note">calibration · bias checks · monitoring · replay</text>
</svg>
