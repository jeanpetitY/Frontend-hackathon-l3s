  <circle cx="1718" cy="270" r="16" fill="#fff" fill-opacity=".18"/><circle cx="1718" cy="265" r="6" fill="#fff"/><path d="M1708 282c2-7 5-10 10-10s8 3 10 10" fill="#fff"/>
