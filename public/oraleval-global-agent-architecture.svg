<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1920" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242832"/><stop offset="1" stop-color="#5F6678"/>
    </linearGradient>
    <linearGradient id="agent" x1="490" y1="450" x2="790" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8F8"/><stop offset="1" stop-color="#FFEDEE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#242832" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#5F6678"/>
    </marker>
    <marker id="arrowCoral" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#EF5B60"/>
    </marker>
    <marker id="arrowPolicy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#8993A4"/>
    </marker>
    <style>
      text{font-family:"Ubuntu Sans",Ubuntu,"Segoe UI",Arial,sans-serif;font-variation-settings:"wdth" 100;fill:#29303B}
      .title{font-size:38px;font-weight:650;fill:#fff;letter-spacing:-.4px}
      .subtitle{font-size:16px;font-weight:450;fill:#fff;fill-opacity:.76}
      .section{font-size:12px;font-weight:650;letter-spacing:1.5px;fill:#667186}
      .h2{font-size:20px;font-weight:650}
      .h3{font-size:15px;font-weight:650}
      .label{font-size:14px;font-weight:550}
      .small{font-size:12px;font-weight:500;fill:#687489}
      .tiny{font-size:11px;font-weight:550;fill:#687489}
      .white{fill:#fff}.coral{fill:#EF5B60}.muted{fill:#687489}
      .card{fill:#fff;stroke:#CBD2DD;stroke-width:1.3}
      .soft{fill:#F5F7FA;stroke:#D6DCE5;stroke-width:1.1}
      .agent-card{fill:url(#agent);stroke:#EF5B60;stroke-width:1.7;stroke-dasharray:7 6}
      .flow{stroke:#5F6678;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none;marker-end:url(#arrow)}
      .ai{stroke:#EF5B60;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;fill:none;marker-end:url(#arrowCoral)}
      .policy{stroke:#8993A4;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 5;fill:none;marker-end:url(#arrowPolicy)}
      .node{fill:#fff;stroke:#EF5B60;stroke-width:2}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F1F3F7"/>
  <rect width="1920" height="150" fill="url(#header)"/>
  <text x="64" y="61" class="title">OralEval — global agent architecture</text>
  <text x="64" y="94" class="subtitle">Course-aware evidence extraction · adaptive questioning · criterion-level evaluation</text>

  <rect x="1180" y="39" width="195" height="58" rx="10" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".16"/>
  <circle cx="1212" cy="68" r="13" fill="#fff" fill-opacity=".22"/><circle cx="1212" cy="64" r="5" fill="#fff"/>
  <path d="M1203 79c1-6 4-9 9-9s8 3 9 9" fill="#fff"/>
  <text x="1237" y="66" class="h3 white">PROFESSOR</text><text x="1237" y="84" class="tiny white">designs · approves</text>

  <rect x="1392" y="39" width="195" height="58" rx="10" fill="#EF5B60"/>
  <circle cx="1424" cy="68" r="13" fill="#fff" fill-opacity=".22"/><text x="1414" y="74" font-size="14" font-weight="700" class="white">AI</text>
  <text x="1449" y="66" class="h3 white">AI AGENTS</text><text x="1449" y="84" class="tiny white">extract · question · assess</text>

  <rect x="1604" y="39" width="252" height="58" rx="10" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".16"/>
  <circle cx="1636" cy="68" r="13" fill="#fff" fill-opacity=".22"/><circle cx="1636" cy="64" r="5" fill="#fff"/>
  <path d="M1627 79c1-6 4-9 9-9s8 3 9 9" fill="#fff"/>
  <text x="1661" y="66" class="h3 white">STUDENT</text><text x="1661" y="84" class="tiny white">submits · answers · reflects</text>

