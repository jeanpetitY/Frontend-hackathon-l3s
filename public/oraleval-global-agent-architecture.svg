  <rect x="190" y="553" width="66" height="62" rx="8" fill="#EAF4FF"/><text x="208" y="580" font-size="17" font-weight="700" fill="#3E6FAE">&lt;/&gt;</text><text x="210" y="600" class="tiny">code</text>
